# Serves the dashboard and proxies the API + socket.io. Terminate TLS in front of this (required in
# production: browsers only allow camera/microphone and secure cookies over HTTPS).
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m;   # inspection evidence uploads

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri /index.html;
  }
}
