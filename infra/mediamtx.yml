# MediaMTX config. Each path is one CCTV camera, named <projectId>_<camNo>.
# Real cameras: add a path with   source: rtsp://user:pass@<camera-ip>:554/stream1
logLevel: info

rtsp: yes
rtspAddress: :8554
hls: no
api: yes
apiAddress: :9997
rtmp: no
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Docker Desktop: advertise the host so browsers can reach the media port. For phones on the LAN,
# set MTX_WEBRTCADDITIONALHOSTS=<your LAN IP> (docker-compose passes HOST_LAN_IP through).
webrtcAdditionalHosts: [127.0.0.1]

# The API server polls the control API for camera health. MediaMTX only allows API calls from
# localhost by default, and Docker's port mapping is not localhost, so allow it here.
# Production: restrict `ips` to the API server's address and give it a password.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

pathDefaults:
  runOnInitRestart: yes

# Simulated cameras: any path like P101_1 starts camera-sim.sh on demand (only while someone watches). It loops
# real CCTV-style footage for the camera's role (infra/clips, fetched by download-clips.sh) with a camera label
# and live clock, or a test pattern if the clips are missing. A marker file in /outages/<path> (written by the
# API's "cut feed" demo control and by the seed) makes the camera refuse to start, so the API's health check
# sees a genuinely dead stream.
paths:
  "~^(P[0-9]+)_([0-9])$":
    runOnDemand: sh /camera-sim.sh
    runOnDemandStartTimeout: 8s
    runOnDemandCloseAfter: 15s
